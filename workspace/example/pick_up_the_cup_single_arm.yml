# Single-arm pick-up-the-cup finetune on Wall-OSS-0.5.
#
# Action target is master, proprio is follow EE + master gripper, matching
# SF_terminal_delivery_shovels_v5_relative_done_0929_1002.yml:
#   rel[k] = master[t+1+k] - follow[t]
# Right arm only: 10-D + action_padding(16) = 26.
# Gripper stays absolute. Position and 6D rotation are relative.
#
# Compute norm stats first:
#
#   python scripts/compute_norm_stats.py \
#     --train_config workspace/example/pick_up_the_cup_single_arm.yml
#
# Launch (from repo root, wall_oss env):
#
#   torchrun --nproc_per_node=8 \
#     wall_x/trainer/fsdp_trainer/train_fsdp.py \
#     --config workspace/example/pick_up_the_cup_single_arm.yml \
#     --wandb_offline true

model_type: qwen2_5

task:
  dof_config:
    master_right_ee_cartesian_pos_relative: 3
    master_right_ee_rotation_6D_relative: 6
    master_right_gripper: 1
    action_padding: 16
  ar_dof_config:
    master_right_ee_cartesian_pos_relative: 3
    master_right_ee_rotation_6D_relative: 6
    master_right_gripper: 1
    action_padding: 16
  agent_pos_config:
    master_right_ee_cartesian_pos: 3
    master_right_ee_rotation_6D: 6
    master_right_gripper: 1
    action_padding: 16
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /mnt/cpfs/zbl-cpfs-new/USERS/bill/September/one_arm/wall-oss-0.5/config.json
  processor_path: /mnt/cpfs/zbl-cpfs-new/Models/Qwen2.5-VL-3B-Instruct
  pretrained_path: /mnt/cpfs/zbl-cpfs-new/Models/Qwen2.5-VL-3B-Instruct
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01

hyperparams:
  num_epoch: 50
  batch_size_per_gpu: 4
  gradient_accumulation_steps: 4
  seed: 10222
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 1000
    num_training_steps: 200000
    min_lr: 1.0e-6

distributed:
  use_fsdp: true
  use_mixed_precision: true
  bf16: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: /mnt/cpfs/zbl-cpfs-new/USERS/bill/September/one_arm/data/pick_up_the_cup_single_arm_lerobot
    root: null
  key_mappings:
    camera:
      observation.images.rightImg: right_wrist_view
    state: observation.state
    action: action
  norm_stats_path: /mnt/cpfs/zbl-cpfs-new/USERS/bill/September/one_arm/data/pick_up_the_cup_single_arm_norm_stats.json
  train_test_split: 0.95
  num_workers: 0
  max_length: 1024
  resolution:
    right_wrist_view: 448

logging:
  log_name: pick_up_the_cup_single_arm
  log_project: wall_oss_cup_single_arm
  log_entity: ""
  use_wandb: true
  log_interval: 10
  save_interval: 2000
  val_interval: 1000000
  epoch_save_interval: 1

checkpoint:
  save_path: /mnt/cpfs/zbl-cpfs-new/USERS/bill/September/one_arm/ckpt/pick_up_the_cup_single_arm
  resume_from: /mnt/cpfs/zbl-cpfs-new/USERS/bill/September/one_arm/wall-oss-0.5/model.safetensors

debug:
  profile: false
  nvtx: false
